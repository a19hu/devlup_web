version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8001:8001"
    env_file:
      - ./frontend/.env
    depends_on:
      - server

  server:
    build:
      context: ./server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
    environment:
      - DEBUG=1
